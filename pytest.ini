[pytest]

addopts = -v --strict-markers

log_cli = true
log_cli_level = INFO

markers =
    smoke
    prod_smoke: read-only, env-agnostic checks safe to run against PRODUCTION (no create/edit)
    sanity
    regression
    validation
    export
    permissions
    superadmin
    admin
    pos
    tunnel
    customer_portal
    e2e
    visual
