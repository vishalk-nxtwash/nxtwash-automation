[pytest]

addopts = -v --strict-markers --timeout=420 --timeout-method=signal --alluredir=reports/allure-results

log_cli = true
log_cli_level = INFO

markers =
    smoke
    prod_smoke: read-only, env-agnostic checks safe to run against PRODUCTION (no create/edit)
    sanity
    regression
    extended: cases that go beyond the core regression suite — boundary, optional fields, UI state
    validation
    export
    permissions
    superadmin
    admin
    pos
    tunnel
    customer_portal
    e2e
    visual
    edge: boundary, negative, and error test cases
    manual: cases that cannot be reliably automated and must be verified by a human tester
