name: Superadmin Smoke (staging)
run-name: "Superadmin Smoke (staging) — ${{ github.event.inputs.runner || 'ubuntu-latest' }} — ${{ github.event_name }}"

# Fast sanity check — runs only @smoke marked tests across the superadmin
# module (login, companies, users, user roles, third party). These are the
# core-path/happy-path tests: page loads, form-open navigation, and the
# handful of create/edit flows that operate on the dedicated automation
# fixtures (e.g. 'vkautomationcompanytest') and are safe to repeat on every
# push. Validation/edge/xfail/seed cases are excluded — those stay in the
# full suite-superadmin.yml (manual dispatch only).
#
# Expected wall-clock: ~5 min (~25 tests, single shard).
#
# Triggers:
#   - Every push to main or development (catches regressions early)
#   - Manual dispatch (run anytime between full suite runs)

on:
  push:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      runner:
        description: '"ubuntu-latest" (GitHub-hosted) or "self-hosted" (EC2) — ignored on push, always ubuntu-latest there'
        required: false
        default: "ubuntu-latest"
      parallel:
        description: "xdist workers: a number, auto, or 0 for serial"
        required: false
        default: "2"

concurrency:
  # ONE shared group across every trigger and runner — this suite mutates
  # persistent staging fixtures (e.g. 'VK Auto Test Role'), so a GitHub-hosted
  # run and an EC2 run must never execute at the same time: two sessions
  # editing/reloading the same row concurrently produces false failures
  # (confirmed 2026-09-26 — both runners failed identically on the same role
  # row when dispatched seconds apart). Queuing (not cancelling) is essential
  # too: cancel-in-progress could kill a run after it renames a role but
  # before its `finally:` block resets it, leaving staging permanently dirty.
  # A queued-but-superseded run is slower; a killed-mid-mutation run is worse.
  group: superadmin-staging
  cancel-in-progress: false

jobs:
  smoke:
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: superadmin-smoke-${{ github.event.inputs.runner || 'ubuntu-latest' }}
      environment: staging
      test_path: tests/superadmin
      marker: smoke
      parallel: ${{ github.event.inputs.parallel || '2' }}
      timeout_minutes: 20
      runner: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
