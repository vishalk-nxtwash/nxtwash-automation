name: Superadmin Suite — GitHub runner

# Runs the full superadmin test suite on GitHub-hosted ubuntu-latest runners.
# Use this when you don't have an AWS self-hosted runner available or just
# want a clean ephemeral environment.
#
# Sharded: 4 jobs in parallel (one per module). Each job gets 2 xdist workers
# (GitHub runners have 2 vCPUs).
#
# Trigger: manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      parallel:
        description: "xdist workers per shard (2 = max for GitHub runner vCPUs)"
        required: false
        default: "2"
      test_path:
        description: "Optional: run only these test path(s)/node id(s) as one job (blank = full sharded suite)"
        required: false
        default: ""

# ONE queue shared by every superadmin workflow that touches staging (full
# suite on either runner, smoke). They all mutate the same managed records, so
# two runs at once corrupt each other's snapshots/resets. Runs queue, never
# cancel (a killed run would skip its teardown resets).
concurrency:
  group: superadmin-staging
  cancel-in-progress: false

jobs:
  superadmin:
    if: ${{ !inputs.test_path }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          # ── Auth ──────────────────────────────────────────────────────────────
          - name: auth
            path: >-
              tests/superadmin/test_login.py
              tests/superadmin/test_login_debug.py
              tests/superadmin/auth
          # ── Companies ─────────────────────────────────────────────────────────
          - name: companies
            path: tests/superadmin/companies
          # ── Users ─────────────────────────────────────────────────────────────
          - name: users
            path: tests/superadmin/users
          # ── User Roles ────────────────────────────────────────────────────────
          - name: user-roles
            path: tests/superadmin/user_roles
          # ── Third Party ───────────────────────────────────────────────────────
          - name: third-party
            path: tests/superadmin/third_party
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: sa-github-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ github.event.inputs.parallel || '2' }}
      timeout_minutes: 60
      runner: ubuntu-latest

  # Fast iteration: one job running just the requested test(s).
  targeted:
    if: ${{ inputs.test_path }}
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: sa-github-targeted
      environment: staging
      test_path: ${{ inputs.test_path }}
      parallel: "0"
      timeout_minutes: 60
      runner: ubuntu-latest
