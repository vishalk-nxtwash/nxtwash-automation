name: UI Tests

# Environment is chosen from the branch:
#   main / master / production  -> PRODUCTION, read-only `prod_smoke` only
#   anything else (development, staging, feature branches, PRs) -> STAGING
# workflow_dispatch lets you override the environment, marker, and worker count.
#
# Credentials are scoped per GitHub Environment ("staging" / "production"), so
# each target has its own secrets and the production Environment can carry
# protection rules (required reviewers, branch limits). Set the same four secret
# NAMES in each Environment with the values for that target:
#   SUPERADMIN_USERNAME / SUPERADMIN_PASSWORD
#   ADMIN_PORTAL_USERNAME / ADMIN_PORTAL_PASSWORD

on:
  push:
    branches: [main, master, production, development, staging]
  pull_request:
  schedule:
    # Nightly full regression against staging (02:30 UTC daily).
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (auto = decide from branch)"
        type: choice
        options: [auto, staging, production]
        default: auto
      marker:
        description: "Pytest marker to run (blank = decide from environment)"
        required: false
        default: ""
      parallel:
        description: "xdist workers: a number, auto, or 0 for serial"
        required: false
        default: "4"

jobs:
  # Decide env + marker up front so the test job can bind to the right
  # GitHub Environment (and its scoped secrets) via an expression.
  determine:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.cfg.outputs.env }}
      marker: ${{ steps.cfg.outputs.marker }}
    steps:
      - name: Resolve run configuration
        id: cfg
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_MARKER: ${{ github.event.inputs.marker }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # 1) Environment: explicit input wins, else derive from the branch.
          env_choice="${INPUT_ENV:-auto}"
          if [ "$env_choice" = "auto" ] || [ -z "$env_choice" ]; then
            case "$BRANCH" in
              main|master|production) env_choice="production" ;;
              *)                      env_choice="staging" ;;
            esac
          fi

          # 2) Marker: explicit input wins, else a safe default per environment.
          marker="${INPUT_MARKER}"
          if [ -z "$marker" ]; then
            if [ "$env_choice" = "production" ]; then
              marker="prod_smoke"
            else
              marker="smoke"
            fi
          fi

          # 3) Hard safety gate: PROD must never run mutating suites.
          if [ "$env_choice" = "production" ] && [ "$marker" != "prod_smoke" ]; then
            echo "::error::Refusing to run marker '$marker' against PRODUCTION. Only 'prod_smoke' is allowed (tests create data that cannot be deleted)."
            exit 1
          fi

          echo "env=$env_choice" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "Resolved: env=$env_choice  marker=$marker  (branch=$BRANCH)"

  ui-tests:
    needs: determine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Binds the job to the GitHub Environment of the same name, pulling that
    # Environment's scoped secrets and applying any protection rules it has.
    environment: ${{ needs.determine.outputs.env }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (headless)
        env:
          HEADLESS: "1"
          TEST_ENV: ${{ needs.determine.outputs.env }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          ADMIN_PORTAL_USERNAME: ${{ secrets.ADMIN_PORTAL_USERNAME }}
          ADMIN_PORTAL_PASSWORD: ${{ secrets.ADMIN_PORTAL_PASSWORD }}
          MARKER: ${{ needs.determine.outputs.marker }}
          # 4 workers matches the GitHub runner's 4 vCPUs; tune via the
          # workflow_dispatch "parallel" input if a run shows flakiness.
          PARALLEL: ${{ github.event.inputs.parallel || '4' }}
        run: |
          # Parallelism: 4 workers by default, "0" forces serial.
          xdist="-n ${PARALLEL}"
          if [ "${PARALLEL}" = "0" ]; then xdist=""; fi

          # 1 rerun is enough for fast PR/smoke feedback; prod smoke is
          # read-only so it also stays at 1.
          reruns=1

          pytest -m "${MARKER}" $xdist \
            --headless --close-browser \
            --reruns $reruns --reruns-delay 3 \
            --alluredir=allure-results \
            --html=report.html --self-contained-html \
            --junitxml=results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ needs.determine.outputs.env }}
          path: |
            allure-results/
            report.html
            results.xml
            screenshots/
            logs/
          if-no-files-found: ignore

      - name: Publish test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: results.xml
        continue-on-error: true

  # Nightly full regression against STAGING only (never touches production).
  nightly-regression:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full regression (headless)
        env:
          HEADLESS: "1"
          TEST_ENV: "staging"
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          ADMIN_PORTAL_USERNAME: ${{ secrets.ADMIN_PORTAL_USERNAME }}
          ADMIN_PORTAL_PASSWORD: ${{ secrets.ADMIN_PORTAL_PASSWORD }}
        run: |
          pytest -m regression -n 2 \
            --headless --close-browser \
            --reruns 2 --reruns-delay 3 \
            --alluredir=allure-results \
            --html=report.html --self-contained-html \
            --junitxml=results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-nightly-staging
          path: |
            allure-results/
            report.html
            results.xml
            screenshots/
            logs/
          if-no-files-found: ignore

      - name: Publish test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: results.xml
        continue-on-error: true
