name: Admin Smoke (staging)

# Fast sanity check — runs only explicitly @pytest.mark.smoke tests: a curated
# ~150-test core (4-6 per module: page loads, key data, filter, create/edit,
# validation, save, export). Expected wall-clock: ~5 min (7 parallel shards).
#
# Trigger: manual dispatch only. All suites are run on demand — no automatic
# runs on push to any branch (team decision 2026-09-27).

on:
  workflow_dispatch:

# Shares the admin-staging queue with suite-admin.yml: both mutate the same
# managed staging records, so they must never run at the same time. Queue,
# never cancel — a killed run would skip its teardown resets.
concurrency:
  group: admin-staging
  cancel-in-progress: false

jobs:
  smoke:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        # ~150 curated smoke tests (explicit @pytest.mark.smoke, ~4-6 core
        # checks per module), balanced into 7 shards of ~15-30 tests.
        shard:
          - name: reports-1
            path: >-
              tests/admin_portal/revenue_overview
              tests/admin_portal/performance_metrics
              tests/admin_portal/general_sales_report
              tests/admin_portal/overview
              tests/admin_portal/transactions

          - name: reports-2
            path: >-
              tests/admin_portal/card_declines
              tests/admin_portal/cash_report
              tests/admin_portal/labor_shifts

          - name: reports-3-login
            path: >-
              tests/admin_portal/wash_activity
              tests/admin_portal/redemptions
              tests/admin_portal/login

          - name: people
            path: >-
              tests/admin_portal/users
              tests/admin_portal/user_roles
              tests/admin_portal/employees
              tests/admin_portal/customers

          - name: catalog-1
            path: >-
              tests/admin_portal/wash_packages
              tests/admin_portal/wash_extras
              tests/admin_portal/wash_books
              tests/admin_portal/coupon_packages
              tests/admin_portal/bank_drop

          - name: catalog-2
            path: >-
              tests/admin_portal/custom_services
              tests/admin_portal/gift_cards
              tests/admin_portal/discounts
              tests/admin_portal/memberships
              tests/admin_portal/service_categories

          - name: settings
            path: >-
              tests/admin_portal/sites
              tests/admin_portal/kiosk_settings
              tests/admin_portal/tunnel_settings
              tests/admin_portal/pos_settings
              tests/admin_portal/gas_pump_settings

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: smoke-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      marker: smoke
      parallel: ${{ matrix.shard.parallel || '2' }}
      timeout_minutes: 20
