name: Superadmin Suite (staging)

# Superadmin tests sharded across parallel runners — one runner per module.
# Tests create companies / users / roles and must never run on production.
# Each GitHub runner has only 2 vCPUs, so -n 2 is the per-runner ceiling.
# Trigger: manual dispatch only (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: '"ubuntu-latest" (GitHub-hosted, ~20 min) or "self-hosted" (EC2)'
        required: false
        default: "ubuntu-latest"
      parallel:
        description: "xdist workers per shard: a number, auto, or 0 for serial"
        required: false
        default: "2"

# ONE queue shared by every superadmin workflow that touches staging (full
# suite on either runner, smoke). They all mutate the same managed records, so
# two runs at once corrupt each other's snapshots/resets. Runs queue, never
# cancel (a killed run would skip its teardown resets).
concurrency:
  group: superadmin-staging
  cancel-in-progress: false

jobs:
  superadmin:
    strategy:
      fail-fast: false
      matrix:
        shard:
          # ── Auth ──────────────────────────────────────────────────────────────
          # login smoke — runs first; downstream modules depend on valid creds
          - name: auth
            path: >-
              tests/superadmin/test_login.py
              tests/superadmin/test_login_debug.py
          # ── Companies ─────────────────────────────────────────────────────────
          # structured companies module + legacy top-level files
          - name: companies
            path: >-
              tests/superadmin/companies
          # ── Users ─────────────────────────────────────────────────────────────
          # list / access / create / edit / filter / export
          - name: users
            path: tests/superadmin/users
          # ── User Roles ────────────────────────────────────────────────────────
          # list / access / create / edit / filter / export / permissions
          - name: user-roles
            path: tests/superadmin/user_roles
          # ── Third Party ───────────────────────────────────────────────────────
          # webhook subscribers / webhook setup / sales path
          - name: third-party
            path: tests/superadmin/third_party
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: superadmin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ github.event.inputs.parallel || '2' }}
      timeout_minutes: 60
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
