name: Run Suite (reusable)

# Reusable test engine — the single place that knows HOW to run the suite.
# Profile workflows (suite-admin / suite-superadmin / suite-prod-smoke) call this
# with WHAT to run. Do not add triggers here other than workflow_call.
#
# Callers must pass `secrets: inherit` so the job can read the environment-scoped
# secrets of the GitHub Environment it binds to:
#   SUPERADMIN_USERNAME / SUPERADMIN_PASSWORD
#   ADMIN_PORTAL_USERNAME / ADMIN_PORTAL_PASSWORD

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment + config/<env>.yaml (staging | production)"
        type: string
        required: true
      label:
        description: "Short label used to name the artifact bundle"
        type: string
        required: true
      test_path:
        description: "Path(s) passed to pytest"
        type: string
        default: "tests"
      marker:
        description: "pytest -m expression (blank = no marker filter)"
        type: string
        default: ""
      parallel:
        description: "xdist workers: a number, auto, or 0 for serial"
        type: string
        default: "2"
      reruns:
        description: "Times to retry each failing test (0 = no retries)"
        type: string
        default: "0"
      timeout_minutes:
        description: "Job timeout in minutes"
        type: number
        default: 90
      runner:
        description: "Runner label — 'self-hosted' (EC2) or 'ubuntu-latest' (GitHub-hosted)"
        type: string
        default: "self-hosted"
    secrets:
      dotenv:
        description: "Full .env contents (KEY=value lines) for the target environment"
        required: true

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - uses: actions/checkout@v4

      - name: Pre-run cleanup
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          # Kill any Chrome/chromedriver left over from a previous crashed run.
          # These hold open file handles that prevent /tmp from being reclaimed.
          pkill -f "chrome" || true
          pkill -f "chromedriver" || true
          # Chrome writes a temp profile (~50-100 MB) per instance; they
          # accumulate in /tmp when a test run is killed mid-flight.
          rm -rf /tmp/.com.google.Chrome* /tmp/com.google.Chrome.* \
                 /tmp/chrome_* \
                 /tmp/.org.chromium.* /tmp/org.chromium.Chromium.* \
                 /tmp/scoped_dir* /tmp/.chromium* \
                 /tmp/pytest-of-* \
                 ~/.config/google-chrome/Crash\ Reports \
                 ~/.config/google-chrome/Crashpad \
                 2>/dev/null || true
          # pytest.ini writes allure results + screenshots + logs into reports/
          # every run. This directory is never wiped by git checkout (gitignored)
          # so it grows without bound across runs — primary cause of disk exhaustion.
          rm -rf reports/ 2>/dev/null || true
          # Also clean any leftover CI-path artifacts from a previously crashed run
          # that didn't reach its own post-run cleanup step.
          rm -rf allure-results/ allure-report/ screenshots/ logs/ \
                 report.html results.xml 2>/dev/null || true
          # Purge pip wheel cache — all deps are pre-installed on this runner
          # so the cache only grows the disk between runs without being needed.
          python3.11 -m pip cache purge 2>/dev/null || true
          echo "=== Disk after cleanup ==="
          df -h /

      # Hard safety gate: PRODUCTION must never run mutating suites. Only the
      # read-only `prod_smoke` marker is allowed (other tests create data that
      # cannot be deleted).
      - name: Safety gate (production is read-only)
        if: inputs.environment == 'production'
        env:
          MARKER: ${{ inputs.marker }}
        run: |
          if [ "${MARKER}" != "prod_smoke" ]; then
            echo "::error::Refusing to run marker '${MARKER:-<none>}' against PRODUCTION. Only 'prod_smoke' is allowed."
            exit 1
          fi

      - name: Set up Python (GitHub-hosted runners)
        if: inputs.runner != 'self-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python
        run: python3.11 --version

      - name: Install dependencies
        run: python3.11 -m pip install -r requirements.txt --quiet

      # The credentials secret is the full .env contents for this environment.
      # ConfigManager.load_dotenv() picks these up automatically at runtime.
      - name: Write .env from secret
        env:
          DOTENV: ${{ secrets.dotenv }}
        run: |
          printf '%s\n' "$DOTENV" > .env
          echo "Wrote .env ($(grep -c '=' .env) key=value lines)."

      - name: Pre-download ChromeDriver
        run: |
          # Log Chrome version so version-mismatch failures are immediately visible.
          google-chrome --version 2>/dev/null || true
          # Download ChromeDriver once in the main process and export its path.
          # xdist workers inherit CHROMEDRIVER_PATH and skip the WDM network
          # check entirely — each worker was previously downloading independently.
          python3.11 - <<'PYEOF'
          import os
          from webdriver_manager.chrome import ChromeDriverManager
          path = ChromeDriverManager().install()
          print(f"ChromeDriver pre-downloaded: {path}")
          env_file = os.environ.get("GITHUB_ENV", "")
          if env_file:
              with open(env_file, "a") as f:
                  f.write(f"CHROMEDRIVER_PATH={path}\n")
          PYEOF

      - name: Spot interruption watchdog
        run: |
          (
            while true; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                http://169.254.169.254/latest/meta-data/spot/termination-time \
                --connect-timeout 1 --max-time 2)
              if [ "$CODE" = "200" ]; then
                echo "::warning::Spot interruption — killing Chrome and stopping pytest (90s grace)."
                # 1. Kill Chrome first — teardown hangs waiting for WebDriver if Chrome is alive
                pkill -9 -f "chrome" 2>/dev/null || true
                pkill -9 -f "chromedriver" 2>/dev/null || true
                # 2. Signal pytest to stop collecting new tests and finish current teardown
                pkill -SIGTERM -f pytest 2>/dev/null || true
                # 3. Give pytest 90 s to write allure-results; hard-kill if still running
                sleep 90
                pkill -9 -f pytest 2>/dev/null || true
                break
              fi
              sleep 5
            done
          ) &

      - name: Run tests (headless)
        env:
          HEADLESS: "1"
          TEST_ENV: ${{ inputs.environment }}
          PARALLEL: ${{ inputs.parallel }}
          MARKER: ${{ inputs.marker }}
          TEST_PATH: ${{ inputs.test_path }}
          RERUNS: ${{ inputs.reruns }}
        run: |
          # Parallelism: number of workers; "0" forces serial.
          xdist="-n ${PARALLEL}"
          if [ "${PARALLEL}" = "0" ]; then xdist=""; fi

          # Optional marker filter; blank = no -m.
          marker_arg=""
          if [ -n "${MARKER}" ]; then marker_arg="-m ${MARKER}"; fi

          # Optional reruns; "0" or empty = no --reruns flag.
          reruns_arg=""
          if [ "${RERUNS:-0}" != "0" ]; then reruns_arg="--reruns ${RERUNS}"; fi

          rm -rf allure-results allure-report
          pytest $marker_arg ${TEST_PATH} $xdist $reruns_arg \
            --headless \
            --alluredir=allure-results \
            --html=report.html --self-contained-html \
            --junitxml=results.xml

      # Render the raw allure-results into a browsable HTML report. Runs even
      # when tests fail so a report is always produced.
      - name: Generate Allure report
        if: always()
        run: |
          command -v allure >/dev/null 2>&1 || npm install -g allure-commandline --silent
          allure generate allure-results --clean -o allure-report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.label }}-${{ github.run_number }}
          path: |
            allure-report/
            allure-results/
            report.html
            results.xml
            reports/screenshots/
            reports/logs/
          if-no-files-found: ignore

      - name: Publish test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: results.xml
        continue-on-error: true

      - name: Post-run cleanup
        if: always()
        run: |
          # Delete large artifact dirs immediately after upload so they do not
          # accumulate on the self-hosted runner disk between runs.
          # reports/ is written by pytest.ini (--alluredir=reports/allure-results)
          # and never removed by git checkout — must be deleted explicitly here.
          rm -rf allure-results allure-report screenshots logs reports \
                 report.html results.xml \
                 2>/dev/null || true
          pkill -f "chrome" || true
          pkill -f "chromedriver" || true
          rm -rf /tmp/.com.google.Chrome* /tmp/com.google.Chrome.* \
                 /tmp/chrome_* \
                 /tmp/.org.chromium.* /tmp/org.chromium.Chromium.* \
                 /tmp/scoped_dir* /tmp/.chromium* \
                 /tmp/pytest-of-* \
                 2>/dev/null || true
          df -h /
