name: Run Suite (reusable)

# Reusable test engine — the single place that knows HOW to run the suite.
# Profile workflows (suite-admin / suite-superadmin / suite-prod-smoke) call this
# with WHAT to run. Do not add triggers here other than workflow_call.
#
# Callers must pass `secrets: inherit` so the job can read these repo secrets:
#   ADMIN_PORTAL_USERNAME / ADMIN_PORTAL_PASSWORD
#   SUPERADMIN_USERNAME / SUPERADMIN_PASSWORD  (optional — only required for superadmin tests)

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment + config/<env>.yaml (staging | production)"
        type: string
        required: true
      label:
        description: "Short label used to name the artifact bundle"
        type: string
        required: true
      test_path:
        description: "Path(s) passed to pytest"
        type: string
        default: "tests"
      marker:
        description: "pytest -m expression (blank = no marker filter)"
        type: string
        default: ""
      parallel:
        description: "xdist workers: a number, auto, or 0 for serial"
        type: string
        default: "2"
      timeout_minutes:
        description: "Job timeout in minutes"
        type: number
        default: 90
    secrets:
      ADMIN_PORTAL_USERNAME:
        description: "Admin portal login username"
        required: true
      ADMIN_PORTAL_PASSWORD:
        description: "Admin portal login password"
        required: true
      SUPERADMIN_USERNAME:
        description: "Superadmin login username"
        required: false
      SUPERADMIN_PASSWORD:
        description: "Superadmin login password"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - uses: actions/checkout@v4

      # Hard safety gate: PRODUCTION must never run mutating suites. Only the
      # read-only `prod_smoke` marker is allowed (other tests create data that
      # cannot be deleted).
      - name: Safety gate (production is read-only)
        if: inputs.environment == 'production'
        env:
          MARKER: ${{ inputs.marker }}
        run: |
          if [ "${MARKER}" != "prod_smoke" ]; then
            echo "::error::Refusing to run marker '${MARKER:-<none>}' against PRODUCTION. Only 'prod_smoke' is allowed."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Java is required by the Allure CLI used to render the HTML report.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Allure CLI
        id: allure-cache
        uses: actions/cache@v4
        with:
          path: ~/.allure-cli
          key: allure-cli-${{ runner.os }}-2.30.0

      - name: Install Allure CLI
        if: steps.allure-cache.outputs.cache-hit != 'true'
        run: npm install -g --prefix ~/.allure-cli allure-commandline --silent

      - name: Write .env from secrets
        env:
          ADMIN_PORTAL_USERNAME: ${{ secrets.ADMIN_PORTAL_USERNAME }}
          ADMIN_PORTAL_PASSWORD: ${{ secrets.ADMIN_PORTAL_PASSWORD }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        run: |
          {
            printf 'ADMIN_PORTAL_USERNAME=%s\n' "$ADMIN_PORTAL_USERNAME"
            printf 'ADMIN_PORTAL_PASSWORD=%s\n' "$ADMIN_PORTAL_PASSWORD"
            [ -n "$SUPERADMIN_USERNAME" ] && printf 'SUPERADMIN_USERNAME=%s\n' "$SUPERADMIN_USERNAME"
            [ -n "$SUPERADMIN_PASSWORD" ] && printf 'SUPERADMIN_PASSWORD=%s\n' "$SUPERADMIN_PASSWORD"
          } > .env
          echo "Wrote .env ($(grep -c '=' .env) key=value lines)."

      - name: Pre-download ChromeDriver
        run: |
          # Download ChromeDriver once in the main process and export its path.
          # xdist workers inherit CHROMEDRIVER_PATH and skip the WDM network
          # check entirely — each worker was previously downloading independently.
          python - <<'PYEOF'
          import os
          from webdriver_manager.chrome import ChromeDriverManager
          path = ChromeDriverManager().install()
          print(f"ChromeDriver pre-downloaded: {path}")
          env_file = os.environ.get("GITHUB_ENV", "")
          if env_file:
              with open(env_file, "a") as f:
                  f.write(f"CHROMEDRIVER_PATH={path}\n")
          PYEOF

      - name: Run tests (headless)
        env:
          HEADLESS: "1"
          TEST_ENV: ${{ inputs.environment }}
          PARALLEL: ${{ inputs.parallel }}
          MARKER: ${{ inputs.marker }}
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          # Parallelism: number of workers; "0" forces serial.
          xdist="-n ${PARALLEL}"
          if [ "${PARALLEL}" = "0" ]; then xdist=""; fi

          # Optional marker filter; blank = no -m.
          marker_arg=""
          if [ -n "${MARKER}" ]; then marker_arg="-m ${MARKER}"; fi

          mkdir -p reports/allure-results reports/screenshots reports/logs
          pytest $marker_arg ${TEST_PATH} $xdist \
            --headless \
            --alluredir=reports/allure-results \
            --html=reports/report.html --self-contained-html \
            --junitxml=reports/results.xml

      # Render the raw allure-results into a browsable HTML report. Runs even
      # when tests fail so a report is always produced.
      - name: Generate Allure report
        if: always()
        run: ~/.allure-cli/bin/allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.label }}-${{ github.run_number }}
          path: |
            reports/allure-report/
            reports/allure-results/
            reports/report.html
            reports/results.xml
            reports/screenshots/
            reports/logs/
          if-no-files-found: ignore

      - name: Publish test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: reports/results.xml
        continue-on-error: true
