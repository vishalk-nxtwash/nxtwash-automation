name: Admin Suite — Retry Failed Shards (staging)

# Targeted re-run of only the shards that failed in the last full suite.
# Use this after pushing a fix to verify the broken modules without re-running
# the shards that were already green (reports, auth-core, customers).
#
# Shards targeted as of 2026-08-06 fixes:
#   discounts   — JS click + fresh open_discounts_page() after create/timeout
#   memberships — JS click + fresh open_memberships_page() after create/timeout
#
# Split into separate parallel jobs (combined shard exceeds 2h wall-clock limit).

on:
  workflow_dispatch:

concurrency:
  group: admin-retry-staging
  cancel-in-progress: false

jobs:
  admin:
    if: github.ref == 'refs/heads/staging'
    strategy:
      fail-fast: false
      matrix:
        shard:
          # ── Discounts ─────────────────────────────────────────────────────
          - name: discounts
            path: tests/admin_portal/discounts
          # ── Memberships ───────────────────────────────────────────────────
          - name: memberships
            path: tests/admin_portal/memberships
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-retry-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: "2"
      timeout_minutes: 120
