name: Admin Suite — Retry Failed Shards (staging)

# Targeted re-run of only the shards that failed in the last full suite.
# Use this after pushing a fix to verify the broken modules without re-running
# the shards that were already green (reports, auth-core, customers).
#
# Shards targeted as of 2026-09-24 EC2 retry run (run 36010026138):
#   wash_books, custom_services, gift_cards, bank_drop all now pass.
#   coupon_packages alone remains unstable — a different test failed each
#   run (CP-EDT-002, then CP-SRH-004), both via the same
#   click-save -> wait_for_list_loaded() timing path in
#   coupon_packages_page.py. Narrowed to just this module to isolate it.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: '"ubuntu-latest" (GitHub-hosted) or "self-hosted" (EC2)'
        required: false
        default: "ubuntu-latest"

concurrency:
  group: admin-retry-${{ inputs.runner || 'ubuntu-latest' }}
  cancel-in-progress: false

jobs:
  admin:
    strategy:
      fail-fast: false
      matrix:
        shard:
          # ── Wash Catalog ──────────────────────────────────────────────────
          - name: coupon-packages
            path: tests/admin_portal/coupon_packages
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-retry-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: "2"
      timeout_minutes: 90
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
