name: Admin Suite — Retry Failed Shards (staging)

# Targeted re-run of only the shards that failed in the last full suite.
# Use this after pushing a fix to verify the broken modules without re-running
# the shards that were already green (reports, auth-core, customers).
#
# Shards targeted as of 2026-09-24 EC2 canary run (run 35941049606):
#   wash-catalog — CP-EDT-002 test_edit_coupon_package_discount timed out
#   services     — GC-EDT-001 test_edit_gift_card_name timed out;
#                  BD-EDT-002 test_edit_bank_drop_order_persists stale read
#   Both passed cleanly on the same commit via GitHub-hosted — suspected
#   EC2 resource-contention timing, re-running here to confirm/reproduce.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: '"ubuntu-latest" (GitHub-hosted) or "self-hosted" (EC2)'
        required: false
        default: "ubuntu-latest"

concurrency:
  group: admin-retry-${{ inputs.runner || 'ubuntu-latest' }}
  cancel-in-progress: false

jobs:
  admin:
    strategy:
      fail-fast: false
      matrix:
        shard:
          # ── Wash Catalog ──────────────────────────────────────────────────
          - name: wash-catalog
            path: >-
              tests/admin_portal/wash_books
              tests/admin_portal/coupon_packages
          # ── Services & Finance ────────────────────────────────────────────
          - name: services
            path: >-
              tests/admin_portal/custom_services
              tests/admin_portal/gift_cards
              tests/admin_portal/bank_drop
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-retry-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: "2"
      timeout_minutes: 90
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
