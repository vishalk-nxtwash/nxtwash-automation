name: Admin Suite — Retry Failed Shards (staging)

# Targeted re-run of only the shards that failed in the last full suite.
# Use this after pushing a fix to verify the broken modules without re-running
# the shards that were already green (reports, auth-core, customers).
#
# Shards targeted as of 2026-08-06 fixes:
#   promotions — JS click + fresh open_*_page() after create/timeout in
#                discounts and memberships conftests and page objects

on:
  workflow_dispatch:

concurrency:
  group: admin-retry-staging
  cancel-in-progress: false

jobs:
  admin:
    if: github.ref == 'refs/heads/staging'
    strategy:
      fail-fast: false
      matrix:
        shard:
          # ── Promotions ────────────────────────────────────────────────────
          - name: promotions
            path: >-
              tests/admin_portal/discounts
              tests/admin_portal/memberships
    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-retry-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: "2"
      timeout_minutes: 120
