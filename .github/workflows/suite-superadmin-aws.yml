name: Superadmin Suite — AWS runner

# Runs the full superadmin test suite on the AWS EC2 self-hosted runner.
# Use this for faster runs (larger instance) or when you need to test against
# the VPC-internal staging environment that GitHub runners can't reach.
#
# Pre-requisites on the runner:
#   - Python 3.11, Google Chrome, ChromeDriver, Java 17 installed
#   - GitHub Actions runner registered with label: self-hosted
#   - STAGING secret (full .env file contents) set in repo/environment secrets
#
# Sharded: 5 jobs, capped to 2 concurrent (see below). This host is t3.large:
# 2 real vCPUs, same as a GitHub-hosted runner — not more, despite the name.
# It's also shared with 3-4 other registered runner agents for the admin
# suite (confirmed 2026-10-03 via instance metadata: all on one ip-172-31-0-106
# box), so even 2 concurrent shards here are competing with whatever else is
# running on that host. Raising `parallel` above 2 reproduces the confirmed
# "runner lost communication (starved for CPU/Memory)" failure from the admin
# suite's AWS runner.
#
# Trigger: manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      parallel:
        description: "xdist workers per shard (this host has 2 real vCPUs — do not raise above 2)"
        required: false
        default: "2"
      test_path:
        description: "Optional: run only these test path(s)/node id(s) as one job (blank = full sharded suite)"
        required: false
        default: ""

# ONE queue shared by every superadmin workflow that touches staging (full
# suite on either runner, smoke). They all mutate the same managed records, so
# two runs at once corrupt each other's snapshots/resets. Runs queue, never
# cancel (a killed run would skip its teardown resets).
concurrency:
  group: superadmin-staging
  cancel-in-progress: false

jobs:
  superadmin:
    if: ${{ !inputs.test_path }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          # ── Auth ──────────────────────────────────────────────────────────────
          - name: auth
            path: >-
              tests/superadmin/test_login.py
              tests/superadmin/test_login_debug.py
              tests/superadmin/auth
          # ── Companies ─────────────────────────────────────────────────────────
          - name: companies
            path: tests/superadmin/companies
          # ── Users ─────────────────────────────────────────────────────────────
          - name: users
            path: tests/superadmin/users
          # ── User Roles ────────────────────────────────────────────────────────
          - name: user-roles
            path: tests/superadmin/user_roles
          # ── Third Party ───────────────────────────────────────────────────────
          - name: third-party
            path: tests/superadmin/third_party
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: sa-aws-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ github.event.inputs.parallel || '2' }}
      timeout_minutes: 45
      runner: self-hosted

  # Fast iteration: one job running just the requested test(s).
  targeted:
    if: ${{ inputs.test_path }}
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: sa-aws-targeted
      environment: staging
      test_path: ${{ inputs.test_path }}
      parallel: "0"
      timeout_minutes: 45
      runner: self-hosted
