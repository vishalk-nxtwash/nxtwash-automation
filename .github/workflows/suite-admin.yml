name: Admin Suite (staging)

# Full admin-portal suite against STAGING on GitHub-hosted runners.
#
# Two modes (manual dispatch only):
#   * Full suite — 4 waves of module shards (waves input selects which).
#   * Targeted  — test_path set: each listed path/node id runs as its own
#     parallel job. Use this to iterate on one module or one failing test
#     without running the whole suite.
#
# parallel: 2 xdist workers per job by default (GitHub-hosted runners have
# 2 vCPUs / 7 GB; the old parallel: 1 limit was for 3.7 GB EC2 runners).

on:
  # Manual dispatch only — no automatic runs on push/schedule (team decision
  # 2026-09-27).
  workflow_dispatch:
    inputs:
      waves:
        description: 'Waves to run — comma-separated (e.g. "1,2") or "all". Ignored when test_path is set.'
        required: false
        default: 'all'
      test_path:
        description: 'Optional: space-separated test paths / node ids. Each entry runs as its own parallel job (blank = full suite by waves).'
        required: false
        default: ''
      parallel:
        description: 'xdist workers per job (GitHub-hosted runners: 2)'
        required: false
        default: '2'

# ONE queue shared by every admin workflow that touches staging (full suite and
# smoke): they mutate the same managed records. Runs queue, never cancel — a
# killed run would skip its teardown resets and leave staging dirty.
concurrency:
  group: admin-staging
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────────
# WAVE 1  (243 + 95 + 186 + 286 = 810 tests)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  wave-1:
    if: ${{ !inputs.test_path && (inputs.waves == 'all' || inputs.waves == '' || contains(inputs.waves, '1')) }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - name: wash-services
            path: >-
              tests/admin_portal/wash_packages
              tests/admin_portal/wash_books
              tests/admin_portal/wash_extras
            timeout: 220

          # 95 tests — customers only (managed fixture, slow index lag)
          # Separated from HR so the managed-customer serialisation group does not
          # block 186 independent employee/labor_shift tests.
          - name: people-customers
            path: tests/admin_portal/customers
            parallel: "2"
            timeout: 120

          # 186 tests — employees + labor_shifts (no managed record contention)
          - name: people-hr
            path: >-
              tests/admin_portal/employees
              tests/admin_portal/labor_shifts
            parallel: "3"
            timeout: 90

          - name: revenue-metrics
            path: >-
              tests/admin_portal/revenue_overview
              tests/admin_portal/performance_metrics

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || inputs.parallel || '2' }}
      runner: ubuntu-latest
      timeout_minutes: ${{ matrix.shard.timeout || 180 }}

# ──────────────────────────────────────────────────────────────────────────────
# WAVE 2  (191 + ~120 + ~150 + 260 = ~721 tests)
# auth-users split: user_roles has 80+ tests with ~75s permission matrix tests
# each; mixing them with login/users/overview caused the 180-min timeout.
# auth-roles runs alone so its 150-min budget is not shared with faster tests.
# ──────────────────────────────────────────────────────────────────────────────
  wave-2:
    needs: wave-1
    if: ${{ always() && !cancelled() && !inputs.test_path && (inputs.waves == 'all' || inputs.waves == '' || contains(inputs.waves, '2')) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - name: promotions
            path: >-
              tests/admin_portal/gift_cards
              tests/admin_portal/coupon_packages
              tests/admin_portal/discounts

          - name: auth-users
            path: >-
              tests/admin_portal/login
              tests/admin_portal/users
              tests/admin_portal/overview
            timeout: 90

          - name: auth-roles
            path: tests/admin_portal/user_roles
            timeout: 180

          - name: financial
            path: >-
              tests/admin_portal/transactions
              tests/admin_portal/cash_report
              tests/admin_portal/general_sales_report

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || inputs.parallel || '2' }}
      runner: ubuntu-latest
      timeout_minutes: ${{ matrix.shard.timeout || 180 }}

# ──────────────────────────────────────────────────────────────────────────────
# WAVE 3  (190 + 212 + 206 = 608 tests)
# ──────────────────────────────────────────────────────────────────────────────
  wave-3:
    needs: wave-2
    if: ${{ always() && !cancelled() && !inputs.test_path && (inputs.waves == 'all' || inputs.waves == '' || contains(inputs.waves, '3')) }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - name: memberships-services
            path: >-
              tests/admin_portal/memberships
              tests/admin_portal/custom_services
              tests/admin_portal/service_categories
              tests/admin_portal/bank_drop
            timeout: 180

          - name: sites-settings
            path: >-
              tests/admin_portal/sites
              tests/admin_portal/kiosk_settings
              tests/admin_portal/tunnel_settings

          - name: pos-hardware
            path: >-
              tests/admin_portal/pos_settings
              tests/admin_portal/card_declines
              tests/admin_portal/gas_pump_settings

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || inputs.parallel || '2' }}
      runner: ubuntu-latest
      timeout_minutes: ${{ matrix.shard.timeout || 180 }}

# ──────────────────────────────────────────────────────────────────────────────
# WAVE 4  (267 tests)
# ──────────────────────────────────────────────────────────────────────────────
  wave-4:
    needs: wave-3
    if: ${{ always() && !cancelled() && !inputs.test_path && (inputs.waves == 'all' || inputs.waves == '' || contains(inputs.waves, '4')) }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - name: activity
            path: >-
              tests/admin_portal/wash_activity
              tests/admin_portal/redemptions

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || inputs.parallel || '2' }}
      runner: ubuntu-latest
      timeout_minutes: ${{ matrix.shard.timeout || 180 }}

# ──────────────────────────────────────────────────────────────────────────────
# TARGETED  — fast iteration: every entry of test_path is its own parallel job.
#   gh workflow run suite-admin.yml --ref <branch> \
#     -f test_path="tests/admin_portal/cash_report tests/admin_portal/card_declines"
# ──────────────────────────────────────────────────────────────────────────────
  plan:
    if: ${{ inputs.test_path }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.split.outputs.targets }}
    steps:
      - id: split
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          # One matrix entry per path; label = artifact-safe version of the path.
          targets=$(printf '%s\n' $TEST_PATH | python3 -c '
          import json, re, sys
          paths = [p for p in sys.stdin.read().split() if p]
          print(json.dumps([{"path": p, "label": re.sub(r"[^A-Za-z0-9_.-]+", "-", p.replace("tests/admin_portal/", ""))[:80]} for p in paths]))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets"

  targeted:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-t-${{ matrix.target.label }}
      environment: staging
      test_path: ${{ matrix.target.path }}
      parallel: ${{ inputs.parallel || '2' }}
      timeout_minutes: 90
      runner: ubuntu-latest
