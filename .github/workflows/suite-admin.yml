name: Admin Suite (staging)

# Full admin-portal suite against STAGING on GitHub-hosted runners.
#
# Two modes (manual dispatch only):
#   * Full suite — one job per admin module, all in parallel (max 12 at once).
#   * Targeted  — test_path set: each listed path/node id runs as its own
#     parallel job. Use this to iterate on one module or one failing test
#     without running the whole suite.
#
# parallel: 2 xdist workers per job by default (GitHub-hosted runners have
# 2 vCPUs / 7 GB; the old parallel: 1 limit was for 3.7 GB EC2 runners).

on:
  # Manual dispatch only — no automatic runs on push/schedule (team decision
  # 2026-09-27).
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Optional: space-separated test paths / node ids. Each entry runs as its own parallel job (blank = full suite, one job per module). Comma-join paths within one entry (no spaces around commas) to run them together in a single job — e.g. "a.py,b.py c.py" is 2 jobs: [a.py+b.py] and [c.py].'
        required: false
        default: ''
      parallel:
        description: 'xdist workers per job (GitHub-hosted runners: 2)'
        required: false
        default: '2'

# ONE queue shared by every admin workflow that touches staging (full suite and
# smoke): they mutate the same managed records. Runs queue, never cancel — a
# killed run would skip its teardown resets and leave staging dirty.
concurrency:
  group: admin-staging
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────────
# FULL SUITE — one job per module, all in parallel (capped).
# Replaces the old 4 sequential "waves", which were sized for 3 EC2 runners'
# RAM and only slowed the full run on GitHub-hosted runners.
# max-parallel 12 → at most ~24 browsers hitting staging at once.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  full:
    if: ${{ !inputs.test_path }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        # Every entry is {module, test_path} so memberships can carry two
        # custom, comma-joined shards instead of the plain tests/admin_portal/
        # <module> path every other module uses. See the memberships-managed /
        # memberships-safe entries below for why: memberships' managed-fixture
        # tests (managed_membership/managed_membership_2) are slow enough on
        # their own to risk the per-job timeout, and splitting them from the
        # fixture-free files gives each its own timeout budget and a clean,
        # separately-reported result instead of one all-or-nothing module job.
        # Tests sharing a managed_resource fixture MUST stay in the same shard
        # — xdist_group only serializes within one job's worker pool, not
        # across separate CI jobs (see feedback_ci_managed_fixture_parallel_race).
        include:
          - module: bank_drop
            test_path: tests/admin_portal/bank_drop
          - module: card_declines
            test_path: tests/admin_portal/card_declines
          - module: cash_report
            test_path: tests/admin_portal/cash_report
          - module: coupon_packages
            test_path: tests/admin_portal/coupon_packages
          - module: custom_services
            test_path: tests/admin_portal/custom_services
          - module: customers
            test_path: tests/admin_portal/customers
          - module: discounts
            test_path: tests/admin_portal/discounts
          - module: employees
            test_path: tests/admin_portal/employees
          - module: gas_pump_settings
            test_path: tests/admin_portal/gas_pump_settings
          - module: general_sales_report
            test_path: tests/admin_portal/general_sales_report
          - module: gift_cards
            test_path: tests/admin_portal/gift_cards
          - module: kiosk_settings
            test_path: tests/admin_portal/kiosk_settings
          - module: labor_shifts
            test_path: tests/admin_portal/labor_shifts
          - module: login
            test_path: tests/admin_portal/login
          - module: memberships-managed
            test_path: tests/admin_portal/memberships/test_memberships_edit.py tests/admin_portal/memberships/test_memberships_managed.py tests/admin_portal/memberships/test_memberships_positive.py tests/admin_portal/memberships/test_memberships_redemption.py tests/admin_portal/memberships/test_memberships_validation.py
          - module: memberships-safe
            test_path: tests/admin_portal/memberships/test_memberships_download.py tests/admin_portal/memberships/test_memberships_edge_cases.py tests/admin_portal/memberships/test_memberships_negative.py tests/admin_portal/memberships/test_memberships_search_filter.py tests/admin_portal/memberships/test_memberships_ui.py
          - module: overview
            test_path: tests/admin_portal/overview
          - module: performance_metrics
            test_path: tests/admin_portal/performance_metrics
          - module: pos_settings
            test_path: tests/admin_portal/pos_settings
          - module: redemptions
            test_path: tests/admin_portal/redemptions
          - module: revenue_overview
            test_path: tests/admin_portal/revenue_overview
          - module: service_categories
            test_path: tests/admin_portal/service_categories
          - module: sites
            test_path: tests/admin_portal/sites
          - module: transactions
            test_path: tests/admin_portal/transactions
          - module: tunnel_settings
            test_path: tests/admin_portal/tunnel_settings
          - module: user_roles
            test_path: tests/admin_portal/user_roles
          - module: users
            test_path: tests/admin_portal/users
          - module: wash_activity
            test_path: tests/admin_portal/wash_activity
          - module: wash_books
            test_path: tests/admin_portal/wash_books
          - module: wash_extras
            test_path: tests/admin_portal/wash_extras
          - module: wash_packages
            test_path: tests/admin_portal/wash_packages
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.module }}
      environment: staging
      test_path: ${{ matrix.test_path }}
      parallel: ${{ inputs.parallel || '2' }}
      timeout_minutes: 90
      runner: ubuntu-latest

# ──────────────────────────────────────────────────────────────────────────────
# TARGETED  — fast iteration: every space-separated entry of test_path is its
# own parallel job. Comma-join paths within one entry (no spaces around the
# commas) to run them together as a single job instead — e.g. tests sharing a
# managed_resource fixture need to land in the same pytest process (so xdist's
# loadgroup scheduling can serialize them) rather than in separate jobs, which
# would race each other on the shared staging record with no coordination.
#   gh workflow run suite-admin.yml --ref <branch> \
#     -f test_path="tests/admin_portal/cash_report tests/admin_portal/card_declines"
#   gh workflow run suite-admin.yml --ref <branch> \
#     -f test_path="tests/admin_portal/memberships/test_memberships_edit.py,tests/admin_portal/memberships/test_memberships_managed.py tests/admin_portal/memberships/test_memberships_ui.py"
# ──────────────────────────────────────────────────────────────────────────────
  plan:
    if: ${{ inputs.test_path }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.split.outputs.targets }}
    steps:
      - id: split
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          # One matrix entry per space-separated group; a comma-joined group
          # becomes one job running all its paths together (label derived from
          # the group's first path, suffixed with the group size when >1).
          targets=$(printf '%s\n' $TEST_PATH | python3 -c '
          import json, re, sys
          groups = [g for g in sys.stdin.read().split() if g]
          out = []
          for g in groups:
              sub_paths = [p for p in g.split(",") if p]
              label = re.sub(r"[^A-Za-z0-9_.-]+", "-", sub_paths[0].replace("tests/admin_portal/", ""))[:80]
              if len(sub_paths) > 1:
                  label += "-plus%d" % (len(sub_paths) - 1)
              out.append({"path": " ".join(sub_paths), "label": label})
          print(json.dumps(out))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets"

  targeted:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-t-${{ matrix.target.label }}
      environment: staging
      test_path: ${{ matrix.target.path }}
      parallel: ${{ inputs.parallel || '2' }}
      timeout_minutes: 90
      runner: ubuntu-latest
