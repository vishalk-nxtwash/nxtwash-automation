name: Admin Suite (staging)

# Full admin-portal suite against STAGING — one module per shard.
# 30 modules across 5 waves, running ONE at a time (max-parallel: 1).
# A single runner handles each module before the next one starts, keeping
# only 2 Chrome instances active on the staging server at any moment.
# Wave N+1 starts only after every shard in Wave N has finished (pass or fail).
#
# Single-module + serial execution prevents:
#   - staging server overload from concurrent browser sessions
#   - runner OOM from accumulated Chrome temp files across modules
#   - one module's teardown contention bleeding into another
#
# All shards: parallel="2" (2 xdist workers per module).
# Timeout defaults to 90 min; managed-fixture-heavy modules use 120 min.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [staging-deploy-complete]

concurrency:
  group: admin-suite-staging
  cancel-in-progress: false

# ── Wave 1 — Core wash services + customers + login + employees ───────────────
# Highest-value modules first; failures here surface before later waves run.
jobs:
  wave1:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard:
          # 78 tests — managed_package fixture; xdist_group serialises on one worker
          - name: wash-packages
            path: tests/admin_portal/wash_packages
            parallel: "2"
            timeout: 90

          # 82 tests — no managed fixture contention
          - name: wash-books
            path: tests/admin_portal/wash_books
            parallel: "2"
            timeout: 90

          # 79 tests — no managed fixture contention
          - name: wash-extras
            path: tests/admin_portal/wash_extras
            parallel: "2"
            timeout: 90

          # 93 tests — managed_customer fixture; xdist_group serialises on one worker
          - name: customers
            path: tests/admin_portal/customers
            parallel: "2"
            timeout: 120

          # 35 tests — login flow; no managed fixtures
          - name: login
            path: tests/admin_portal/login
            parallel: "2"
            timeout: 60

          # 98 tests — employee records; no managed fixture contention
          - name: employees
            path: tests/admin_portal/employees
            parallel: "2"
            timeout: 90

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel }}
      timeout_minutes: ${{ matrix.shard.timeout }}

# ── Wave 2 — People ops + reporting ──────────────────────────────────────────
  wave2:
    needs: wave1
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard:
          # 57 tests — labor shift records; no managed fixture contention
          - name: labor-shifts
            path: tests/admin_portal/labor_shifts
            parallel: "2"
            timeout: 90

          # 66 tests — user management
          - name: users
            path: tests/admin_portal/users
            parallel: "2"
            timeout: 90

          # 58 tests — role-based access
          - name: user-roles
            path: tests/admin_portal/user_roles
            parallel: "2"
            timeout: 90

          # 188 tests — largest module; read-only revenue dashboard
          - name: revenue-overview
            path: tests/admin_portal/revenue_overview
            parallel: "2"
            timeout: 120

          # 63 tests — read-only metrics
          - name: performance-metrics
            path: tests/admin_portal/performance_metrics
            parallel: "2"
            timeout: 90

          # 76 tests — admin portal overview dashboard
          - name: overview
            path: tests/admin_portal/overview
            parallel: "2"
            timeout: 90

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel }}
      timeout_minutes: ${{ matrix.shard.timeout }}

# ── Wave 3 — Promotions + memberships + services ─────────────────────────────
  wave3:
    needs: wave2
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard:
          # 66 tests — managed membership fixture; xdist_group serialises
          - name: memberships
            path: tests/admin_portal/memberships
            parallel: "2"
            timeout: 120

          # 36 tests — managed service_category fixture
          - name: service-categories
            path: tests/admin_portal/service_categories
            parallel: "2"
            timeout: 90

          # 58 tests — custom service records
          - name: custom-services
            path: tests/admin_portal/custom_services
            parallel: "2"
            timeout: 90

          # 73 tests — managed_discount + managed_percentage_discount fixtures
          - name: discounts
            path: tests/admin_portal/discounts
            parallel: "2"
            timeout: 90

          # 37 tests — gift card records
          - name: gift-cards
            path: tests/admin_portal/gift_cards
            parallel: "2"
            timeout: 60

          # 45 tests — coupon package records
          - name: coupon-packages
            path: tests/admin_portal/coupon_packages
            parallel: "2"
            timeout: 60

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel }}
      timeout_minutes: ${{ matrix.shard.timeout }}

# ── Wave 4 — Settings + hardware ─────────────────────────────────────────────
  wave4:
    needs: wave3
