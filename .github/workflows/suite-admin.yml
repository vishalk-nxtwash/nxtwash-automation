name: Admin Suite (staging)

# Full admin-portal suite against STAGING on GitHub-hosted runners.
#
# Two modes (manual dispatch only):
#   * Full suite — one job per admin module, all in parallel (max 12 at once).
#   * Targeted  — test_path set: each listed path/node id runs as its own
#     parallel job. Use this to iterate on one module or one failing test
#     without running the whole suite.
#
# parallel: 2 xdist workers per job by default (GitHub-hosted runners have
# 2 vCPUs / 7 GB; the old parallel: 1 limit was for 3.7 GB EC2 runners).

on:
  # Manual dispatch only — no automatic runs on push/schedule (team decision
  # 2026-09-27).
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Optional: space-separated test paths / node ids. Each entry runs as its own parallel job (blank = full suite, one job per module). Comma-join paths within one entry (no spaces around commas) to run them together in a single job — e.g. "a.py,b.py c.py" is 2 jobs: [a.py+b.py] and [c.py].'
        required: false
        default: ''
      parallel:
        description: 'xdist workers per job (GitHub-hosted runners: 2)'
        required: false
        default: '2'

# ONE queue shared by every admin workflow that touches staging (full suite and
# smoke): they mutate the same managed records. Runs queue, never cancel — a
# killed run would skip its teardown resets and leave staging dirty.
concurrency:
  group: admin-staging
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────────
# FULL SUITE — one job per module, all in parallel (capped).
# Replaces the old 4 sequential "waves", which were sized for 3 EC2 runners'
# RAM and only slowed the full run on GitHub-hosted runners.
# max-parallel 12 → at most ~24 browsers hitting staging at once.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  full:
    if: ${{ !inputs.test_path }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        module:
          - bank_drop
          - card_declines
          - cash_report
          - coupon_packages
          - custom_services
          - customers
          - discounts
          - employees
          - gas_pump_settings
          - general_sales_report
          - gift_cards
          - kiosk_settings
          - labor_shifts
          - login
          - memberships
          - overview
          - performance_metrics
          - pos_settings
          - redemptions
          - revenue_overview
          - service_categories
          - sites
          - transactions
          - tunnel_settings
          - user_roles
          - users
          - wash_activity
          - wash_books
          - wash_extras
          - wash_packages
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.module }}
      environment: staging
      test_path: tests/admin_portal/${{ matrix.module }}
      parallel: ${{ inputs.parallel || '2' }}
      timeout_minutes: 90
      runner: ubuntu-latest

# ──────────────────────────────────────────────────────────────────────────────
# TARGETED  — fast iteration: every space-separated entry of test_path is its
# own parallel job. Comma-join paths within one entry (no spaces around the
# commas) to run them together as a single job instead — e.g. tests sharing a
# managed_resource fixture need to land in the same pytest process (so xdist's
# loadgroup scheduling can serialize them) rather than in separate jobs, which
# would race each other on the shared staging record with no coordination.
#   gh workflow run suite-admin.yml --ref <branch> \
#     -f test_path="tests/admin_portal/cash_report tests/admin_portal/card_declines"
#   gh workflow run suite-admin.yml --ref <branch> \
#     -f test_path="tests/admin_portal/memberships/test_memberships_edit.py,tests/admin_portal/memberships/test_memberships_managed.py tests/admin_portal/memberships/test_memberships_ui.py"
# ──────────────────────────────────────────────────────────────────────────────
  plan:
    if: ${{ inputs.test_path }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.split.outputs.targets }}
    steps:
      - id: split
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          # One matrix entry per space-separated group; a comma-joined group
          # becomes one job running all its paths together (label derived from
          # the group's first path, suffixed with the group size when >1).
          targets=$(printf '%s\n' $TEST_PATH | python3 -c '
          import json, re, sys
          groups = [g for g in sys.stdin.read().split() if g]
          out = []
          for g in groups:
              sub_paths = [p for p in g.split(",") if p]
              label = re.sub(r"[^A-Za-z0-9_.-]+", "-", sub_paths[0].replace("tests/admin_portal/", ""))[:80]
              if len(sub_paths) > 1:
                  label += "-plus%d" % (len(sub_paths) - 1)
              out.append({"path": " ".join(sub_paths), "label": label})
          print(json.dumps(out))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets"

  targeted:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-t-${{ matrix.target.label }}
      environment: staging
      test_path: ${{ matrix.target.path }}
      parallel: ${{ inputs.parallel || '2' }}
      timeout_minutes: 90
      runner: ubuntu-latest
