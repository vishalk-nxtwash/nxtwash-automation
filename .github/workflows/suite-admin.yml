name: Admin Suite (staging)

# Full admin-portal suite against STAGING, SHARDED across parallel runners.
# Each GitHub runner has only 2 vCPUs, so `-n 1` is the safe per-runner ceiling.
# max-parallel: 3 caps concurrent shards to stay within the runner's 3.7 GB RAM
# (3 shards × 1 Chrome × ~500 MB = ~1.5 GB — well within limit).
# Triggers: every push to `staging`, manual dispatch, weekly Sunday 03:00 UTC.

on:
  push:
    branches: [staging]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  repository_dispatch:
    types: [staging-deploy-complete]

# One admin staging run at a time (its shards run in parallel within the run);
# a second run queues rather than racing on shared staging data.
concurrency:
  group: admin-suite-staging
  cancel-in-progress: false

jobs:
  admin:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - name: discounts
            path: tests/admin_portal/discounts
          - name: memberships
            path: tests/admin_portal/memberships
          - name: wash-packages
            path: tests/admin_portal/wash_packages tests/admin_portal/gift_cards
          # - name: sites
          #   path: tests/admin_portal/sites
          # - name: service-categories
          #   path: tests/admin_portal/service_categories
          # - name: overview
          #   path: tests/admin_portal/overview
          # - name: login
          #   path: tests/admin_portal/login
          # - name: wash-extras
          #   path: tests/admin_portal/wash_extras
          # - name: wash-books
          #   path: tests/admin_portal/wash_books
          # - name: coupon-packages
          #   path: tests/admin_portal/coupon_packages tests/admin_portal/gift_cards
    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: "1"
      timeout_minutes: 90
