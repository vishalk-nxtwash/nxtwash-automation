name: Admin Suite (staging)

# Full admin-portal suite against STAGING, SHARDED across parallel runners.
# Each GitHub runner has only 2 vCPUs, so `-n 2` is the per-runner ceiling and
# the full 423-test suite on a single runner takes ~2h+. Splitting it across
# parallel runners (one per shard) brings wall-clock down to ~the slowest shard.
# Triggers: every push to `staging`, manual dispatch, weekly Sunday 03:00 UTC.

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      reruns:
        description: "Flaky-test reruns per test"
        required: false
        default: "2"
  schedule:
    - cron: "0 3 * * 0"
  repository_dispatch:
    types: [staging-deploy-complete]

# One admin staging run at a time (its shards run in parallel within the run);
# a second run queues rather than racing on shared staging data.
concurrency:
  group: admin-suite-staging
  cancel-in-progress: false

jobs:
  admin:
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Balanced ~83–106 tests each (full admin_portal = 574). Every module
          # is covered exactly once across the six shards.
          - name: wash-books
            path: tests/admin_portal/wash_books
          - name: wash-extras
            path: tests/admin_portal/wash_extras
          - name: wash-packages
            path: tests/admin_portal/wash_packages tests/admin_portal/gift_cards
          - name: discounts
            path: tests/admin_portal/discounts tests/admin_portal/overview
          - name: memberships
            path: tests/admin_portal/memberships tests/admin_portal/sites
          - name: services-login
            path: tests/admin_portal/login tests/admin_portal/service_categories tests/admin_portal/coupon_packages
    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: "2"
      reruns: ${{ github.event.inputs.reruns || '2' }}
      timeout_minutes: 60
