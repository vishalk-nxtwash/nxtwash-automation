name: Admin Suite (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  repository_dispatch:
    types: [staging-deploy-complete]

concurrency:
  group: admin-suite-staging
  cancel-in-progress: false

jobs:
  admin:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard:
          - name: discounts
            path: tests/admin_portal/discounts

          # parallel=2: worker-1 handles all managed_membership tests (xdist_group
          # pins them to one worker); worker-2 runs the 49 browser-only tests
          # (search/filter, UI, validation) concurrently. timeout=180 because
          # 17 managed teardowns × ~4-6 min each = up to 102 min on slow staging.
          - name: memberships
            path: tests/admin_portal/memberships
            parallel: "2"
            timeout: 180

    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '1' }}
      timeout_minutes: ${{ matrix.shard.timeout || 120 }}
