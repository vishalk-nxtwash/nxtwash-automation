name: Admin Suite (staging)

# Full admin-portal suite against STAGING, sharded across 3 self-hosted runners
# in 4 sequential waves.  All 3 runners fire within each wave; Wave N+1 starts
# only after every shard in Wave N has finished (pass or fail).
# Domain grouping keeps related failures together in the run summary.
#
# Parallelism guide (per shard):
#   parallel: "2" — shard contains managed fixtures; -n 3 causes contention on
#                   the shared record and produces >240 s teardown spikes.
#   parallel: "3" — default for mutation shards without managed record contention.
#   parallel: "4" — read-only report shards; no mutation risk, extra worker wins
#                   on IO-bound staging latency.
#   timeout: 180  — shards with managed fixtures whose full reset can take ~3 min
#                   per test cycle; 120 min default is routinely exceeded at -n 2.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [staging-deploy-complete]

concurrency:
  group: admin-suite-staging
  cancel-in-progress: false

# ── Wave 1 ────────────────────────────────────────────────────────────────────
# All 4 runners fire immediately.
# Wash services first: managed-fixture teardowns are the longest per-test cost
# and finishing them early frees runners sooner for lighter waves.
jobs:
  wave1:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          # 243 tests — wash_packages (26 managed) + wash_books + wash_extras
          # parallel=2: managed_package fixture serialises on one xdist worker;
          # -n 3 caused >240 s teardown contention on the shared package record.
          - name: wash-services
            path: >-
              tests/admin_portal/wash_packages
              tests/admin_portal/wash_books
              tests/admin_portal/wash_extras
            parallel: "2"
            timeout: 180

          # 95 tests — customers only (managed fixture, slow index lag)
          # Separated from HR so the managed-customer serialisation group does not
          # block 186 independent employee/labor_shift tests.
          - name: people-customers
            path: tests/admin_portal/customers
            parallel: "2"
            timeout: 120

          # 186 tests — employees + labor_shifts (no managed record contention)
          - name: people-hr
            path: >-
              tests/admin_portal/employees
              tests/admin_portal/labor_shifts
            parallel: "2"
            timeout: 120

          # 286 tests — revenue_overview + performance_metrics
          # parallel=2: reduced from 4 to cap peak Chrome processes on single runner.
          - name: revenue-metrics
            path: >-
              tests/admin_portal/revenue_overview
              tests/admin_portal/performance_metrics
            parallel: "2"

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '3' }}
      timeout_minutes: ${{ matrix.shard.timeout || 120 }}

# ── Wave 2 ────────────────────────────────────────────────────────────────────
# Starts after all Wave 1 shards finish.  Runs even if Wave 1 had test
# failures — only a workflow cancellation skips this wave.
  wave2:
    needs: wave1
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          # 191 tests — gift_cards (1 managed) + coupon_packages (1 managed) + discounts (16 managed)
          # parallel=2: discounts managed_discount and managed_percentage_discount
          # fixtures both use xdist_group serialisation; -n 3 caused save timeouts.
          - name: promotions
            path: >-
              tests/admin_portal/gift_cards
              tests/admin_portal/coupon_packages
              tests/admin_portal/discounts
            parallel: "2"

          # 267 tests — login + users + user_roles + overview
          # parallel=2: capped for single-runner memory safety.
          - name: auth-users
            path: >-
              tests/admin_portal/login
              tests/admin_portal/users
              tests/admin_portal/user_roles
              tests/admin_portal/overview
            parallel: "2"

          # 260 tests — transactions + cash_report + general_sales_report
          # parallel=2: reduced from 4 for single-runner memory safety.
          - name: financial
            path: >-
              tests/admin_portal/transactions
              tests/admin_portal/cash_report
              tests/admin_portal/general_sales_report
            parallel: "2"

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '3' }}
      timeout_minutes: ${{ matrix.shard.timeout || 120 }}

# ── Wave 3 ────────────────────────────────────────────────────────────────────
# Starts after all Wave 2 shards finish.
  wave3:
    needs: wave2
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          # 190 tests — memberships (17 managed) + custom_services + service_categories (7 managed) + bank_drop
          # parallel=2 + timeout=180: two managed-fixture groups serialise on
          # separate xdist workers; combined teardown load needs the extra headroom.
          - name: memberships-services
            path: >-
              tests/admin_portal/memberships
              tests/admin_portal/custom_services
              tests/admin_portal/service_categories
              tests/admin_portal/bank_drop
            parallel: "2"
            timeout: 180

          # 212 tests — sites + kiosk_settings + tunnel_settings
          # parallel=2: kiosk managed fixtures contend on shared device record.
          - name: sites-settings
            path: >-
              tests/admin_portal/sites
              tests/admin_portal/kiosk_settings
              tests/admin_portal/tunnel_settings
            parallel: "2"

          # 206 tests — pos_settings + card_declines + gas_pump_settings
          # parallel=2: capped for single-runner memory safety.
          - name: pos-hardware
            path: >-
              tests/admin_portal/pos_settings
              tests/admin_portal/card_declines
              tests/admin_portal/gas_pump_settings
            parallel: "2"

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '3' }}
      timeout_minutes: ${{ matrix.shard.timeout || 120 }}

# ── Wave 4 ────────────────────────────────────────────────────────────────────
# Starts after all Wave 3 shards finish.  Uses 1 of 3 runners.
  wave4:
    needs: wave3
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          # 267 tests — wash_activity + redemptions
          # Read-only activity reports; parallel=4 for IO throughput.
          - name: activity
            path: >-
              tests/admin_portal/wash_activity
              tests/admin_portal/redemptions
            parallel: "4"

    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '3' }}
      timeout_minutes: ${{ matrix.shard.timeout || 120 }}
