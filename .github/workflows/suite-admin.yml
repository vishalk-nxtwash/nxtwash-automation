name: Admin Suite (staging)

# Full admin-portal suite against STAGING, SHARDED across parallel runners.
# Each GitHub runner has only 2 vCPUs, so `-n 2` is the per-runner ceiling.
# Splitting across parallel runners (one per shard) brings wall-clock down to
# ~the slowest shard.
# Trigger: manual dispatch only (workflow_dispatch).

on:
  schedule:
    - cron: "0 0 * * *"   # midnight UTC every day
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner — "ubuntu-latest" (GitHub-hosted, ~30 min) or "self-hosted" (EC2)'
        required: false
        default: "ubuntu-latest"

# Separate concurrency slots per runner so GitHub-hosted and EC2 runs
# never block each other.
concurrency:
  group: admin-suite-${{ inputs.runner || 'ubuntu-latest' }}
  cancel-in-progress: false

jobs:
  admin:
    strategy:
      fail-fast: false
      matrix:
        shard:
          # ── Reports (read-only, fully parallel-safe) ──────────────────────
          # 139 tests — overview + performance_metrics
          - name: reports-overview
            path: >-
              tests/admin_portal/overview
              tests/admin_portal/performance_metrics
          # 164 tests — revenue_overview + general_sales_report
          - name: reports-revenue
            path: >-
              tests/admin_portal/revenue_overview
              tests/admin_portal/general_sales_report
          # 151 tests — cash_report + card_declines + transactions
          - name: reports-financial
            path: >-
              tests/admin_portal/cash_report
              tests/admin_portal/card_declines
              tests/admin_portal/transactions
          # 177 tests — labor_shifts + redemptions + wash_activity
          - name: reports-ops
            path: >-
              tests/admin_portal/labor_shifts
              tests/admin_portal/redemptions
              tests/admin_portal/wash_activity
          # ── Auth & Core (run early; downstream modules depend on this data) ─
          # 131 tests — login + sites + service_categories
          - name: auth-core
            path: >-
              tests/admin_portal/login
              tests/admin_portal/sites
              tests/admin_portal/service_categories
          # ── Wash Catalog ──────────────────────────────────────────────────
          # 157 tests — wash_packages + wash_extras
          - name: wash-packages
            path: >-
              tests/admin_portal/wash_packages
              tests/admin_portal/wash_extras
          # 127 tests — wash_books + coupon_packages
          - name: wash-catalog
            path: >-
              tests/admin_portal/wash_books
              tests/admin_portal/coupon_packages
          # ── Services & Finance ────────────────────────────────────────────
          # 122 tests — custom_services + gift_cards + bank_drop
          - name: services
            path: >-
              tests/admin_portal/custom_services
              tests/admin_portal/gift_cards
              tests/admin_portal/bank_drop
          # ── Promotions & Loyalty ──────────────────────────────────────────
          # memberships commented out — filter panel JS click fix pending verification
          - name: promotions
            path: >-
              tests/admin_portal/discounts
          # ── Customers ─────────────────────────────────────────────────────
          # 97 tests — isolated; complex customer-facing flows
          - name: customers
            path: tests/admin_portal/customers
          # ── Hardware Settings ─────────────────────────────────────────────
          # 117 tests — kiosk_settings + tunnel_settings
          - name: settings-hw
            path: >-
              tests/admin_portal/kiosk_settings
              tests/admin_portal/tunnel_settings
          # ── POS & Access Control ──────────────────────────────────────────
          # 126 tests — pos_settings + user_roles
          - name: settings-pos
            path: >-
              tests/admin_portal/pos_settings
              tests/admin_portal/user_roles
          # ── People & HR ───────────────────────────────────────────────────
          # people (users + employees) commented out — filter panel JS click fix pending verification
          # - name: people
          #   path: >-
          #     tests/admin_portal/users
          #     tests/admin_portal/employees
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: "2"
      timeout_minutes: 90
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
