name: Admin Suite (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  repository_dispatch:
    types: [staging-deploy-complete]

concurrency:
  group: admin-suite-staging
  cancel-in-progress: false

jobs:
  admin:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard:
          - name: discounts
            path: tests/admin_portal/discounts

          - name: memberships
            path: tests/admin_portal/memberships

    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '1' }}
      timeout_minutes: ${{ matrix.shard.timeout || 120 }}
