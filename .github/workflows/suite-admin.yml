name: Admin Suite (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  repository_dispatch:
    types: [staging-deploy-complete]

concurrency:
  group: admin-suite-staging
  cancel-in-progress: false

jobs:
  admin:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard:
          - name: gift-cards
            path: tests/admin_portal/gift_cards tests/admin_portal/coupon_packages

          # - name: discounts
          #   path: tests/admin_portal/discounts
          # - name: memberships
          #   path: tests/admin_portal/memberships
          #   parallel: "2"
          #   timeout: 180
          - name: wash-packages
            path: tests/admin_portal/wash_packages

          # --- queued when ready ---
          # - name: wash-books
          #   path: tests/admin_portal/wash_books
          # - name: wash-extras
          #   path: tests/admin_portal/wash_extras
          # - name: sites
          #   path: tests/admin_portal/sites
          # - name: service-categories
          #   path: tests/admin_portal/service_categories
          # - name: overview
          #   path: tests/admin_portal/overview
          # - name: login
          #   path: tests/admin_portal/login

    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '1' }}
      timeout_minutes: ${{ matrix.shard.timeout || 120 }}
