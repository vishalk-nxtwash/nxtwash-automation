name: Admin Suite (staging)

# Full admin-portal suite against STAGING, SHARDED across parallel runners.
# Each GitHub runner has only 2 vCPUs, so `-n 2` is the per-runner ceiling.
# Splitting across parallel runners (one per shard) brings wall-clock down to
# ~the slowest shard.
# Trigger: manual dispatch only (workflow_dispatch).

on:
  schedule:
    - cron: "0 0 * * *"   # midnight UTC every day
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner — "ubuntu-latest" (GitHub-hosted, ~30 min) or "self-hosted" (EC2)'
        required: false
        default: "ubuntu-latest"

# Separate concurrency slots per runner so GitHub-hosted and EC2 runs
# never block each other.
concurrency:
  group: admin-suite-${{ inputs.runner || 'ubuntu-latest' }}
  cancel-in-progress: false

jobs:
  admin:
    strategy:
      fail-fast: false
      matrix:
        shard:
          # ── Reports (read-only, fully parallel-safe) ──────────────────────
          # 139 tests — overview + performance_metrics
          - name: reports-overview
            path: >-
              tests/admin_portal/overview
              tests/admin_portal/performance_metrics
          # 188 tests — revenue_overview (split from reports-revenue; largest report module)
          - name: reports-revenue
            path: tests/admin_portal/revenue_overview
          # 70 tests — general_sales_report (split from reports-revenue)
          - name: reports-sales
            path: tests/admin_portal/general_sales_report
          # 85 tests — cash_report + card_declines
          - name: reports-financial
            path: >-
              tests/admin_portal/cash_report
              tests/admin_portal/card_declines
          # 58 tests — transactions (split from reports-financial)
          - name: reports-transactions
            path: tests/admin_portal/transactions
          # 57 tests — labor_shifts; I/O-bound so 3 workers fit 2-vCPU runner
          - name: reports-labor-shifts
            path: tests/admin_portal/labor_shifts
            parallel: "3"
          # 60 tests — redemptions (split from reports-labor-shifts)
          - name: reports-redemptions
            path: tests/admin_portal/redemptions
          # 120 tests — wash_activity (split from reports-ops; largest ops module)
          - name: reports-wash-activity
            path: tests/admin_portal/wash_activity
          # ── Auth & Core ───────────────────────────────────────────────────
          # ~68 tests — login + sites (service_categories split out)
          - name: auth-core
            path: >-
              tests/admin_portal/login
              tests/admin_portal/sites
          # ~23 tests — service_categories (split from auth-core)
          - name: auth-service-categories
            path: tests/admin_portal/service_categories
          # ── Wash Catalog ──────────────────────────────────────────────────
          # 157 tests — wash_packages + wash_extras
          - name: wash-packages
            path: >-
              tests/admin_portal/wash_packages
              tests/admin_portal/wash_extras
          # 127 tests — wash_books + coupon_packages
          - name: wash-catalog
            path: >-
              tests/admin_portal/wash_books
              tests/admin_portal/coupon_packages
          # ── Services & Finance ────────────────────────────────────────────
          # 122 tests — custom_services + gift_cards + bank_drop
          - name: services
            path: >-
              tests/admin_portal/custom_services
              tests/admin_portal/gift_cards
              tests/admin_portal/bank_drop
          # ── Promotions & Loyalty ──────────────────────────────────────────
          - name: promotions
            path: >-
              tests/admin_portal/discounts
              tests/admin_portal/memberships
          # ── Customers ─────────────────────────────────────────────────────
          # 93 tests — isolated; complex customer-facing flows
          - name: customers
            path: tests/admin_portal/customers
          # ── Hardware Settings ─────────────────────────────────────────────
          # 117 tests — kiosk_settings + tunnel_settings
          - name: settings-hw
            path: >-
              tests/admin_portal/kiosk_settings
              tests/admin_portal/tunnel_settings
          # ── POS Settings ──────────────────────────────────────────────────
          # 68 tests — pos_settings (split from settings-pos)
          - name: pos-settings
            path: tests/admin_portal/pos_settings
          # 37 tests — gas_pump_settings (was missing from this workflow entirely)
          - name: gas-pump-settings
            path: tests/admin_portal/gas_pump_settings
          # ── Access Control ────────────────────────────────────────────────
          # 58 tests — user_roles (split from settings-pos)
          - name: user-roles
            path: tests/admin_portal/user_roles
          # ── People & HR ───────────────────────────────────────────────────
          - name: people
            path: >-
              tests/admin_portal/users
              tests/admin_portal/employees
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '2' }}
      timeout_minutes: 90
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
