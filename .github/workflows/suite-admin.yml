            timeout: 90

          # 120 tests — wash activity log; read-only
          - name: wash-activity
            path: tests/admin_portal/wash_activity
            parallel: "2"
            timeout: 90

          # 60 tests — redemption records
          - name: redemptions
            path: tests/admin_portal/redemptions
            parallel: "2"
