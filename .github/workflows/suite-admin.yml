name: Admin Suite (staging)

# Full admin-portal suite against STAGING, sharded across 4 sequential waves.
# Within each wave up to 3 shards run in parallel (3 self-hosted runners available:
# admin-staging-01/02/03).  Wave-1 has 4 shards — the 4th queues and starts as soon
# as the fastest of the first 3 finishes (people-hr ~90 min → queue clears before
# wash-services 220 min deadline).
# Waves 2-4 use if: !cancelled() — they proceed even when a prior wave has test
# failures so you see the full picture in one run; they only skip on a manual cancel.
#
# parallel: 1 across the board — one Chrome per runner at a time.
# Peak RAM per runner: ~1.3 GB (well within 3.7 GB).
# parallel: 2 caused OOM kills after ~25 min (2 Chrome × ~900 MB = ~2.8 GB peak).
# timeout: 180 default — largest shards (~280 tests × 30s serial) need ~140 min.

on:
  # TEMPORARILY DISABLED (2026-09-24): push/schedule/repository_dispatch
  # commented out while EC2 self-hosted runner work is in progress on
  # ci/ec2-runner-setup, so this doesn't compete for admin-staging-01/02/03.
  # Re-enable by uncommenting once that work is done.
  # push:
  #   branches: [staging]
  workflow_dispatch:
    inputs:
      waves:
        description: 'Waves to run — comma-separated (e.g. "1,2") or "all". Default: all.'
        required: false
        default: 'all'
  # schedule:
  #   - cron: "0 3 * * 0"
  # repository_dispatch:
  #   types: [staging-deploy-complete]

concurrency:
  group: admin-suite-staging
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────────
# WAVE 1  (243 + 95 + 186 + 286 = 810 tests)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  wave-1:
    if: inputs.waves == 'all' || inputs.waves == '' || contains(inputs.waves, '1')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - name: wash-services
            path: >-
              tests/admin_portal/wash_packages
              tests/admin_portal/wash_books
              tests/admin_portal/wash_extras
            timeout: 220

          # 95 tests — customers only (managed fixture, slow index lag)
          # Separated from HR so the managed-customer serialisation group does not
          # block 186 independent employee/labor_shift tests.
          - name: people-customers
            path: tests/admin_portal/customers
            parallel: "2"
            timeout: 120

          # 186 tests — employees + labor_shifts (no managed record contention)
          - name: people-hr
            path: >-
              tests/admin_portal/employees
              tests/admin_portal/labor_shifts
            parallel: "3"
            timeout: 90

          - name: revenue-metrics
            path: >-
              tests/admin_portal/revenue_overview
              tests/admin_portal/performance_metrics

    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '1' }}
      timeout_minutes: ${{ matrix.shard.timeout || 180 }}

# ──────────────────────────────────────────────────────────────────────────────
# WAVE 2  (191 + ~120 + ~150 + 260 = ~721 tests)
# auth-users split: user_roles has 80+ tests with ~75s permission matrix tests
# each; mixing them with login/users/overview caused the 180-min timeout.
# auth-roles runs alone so its 150-min budget is not shared with faster tests.
# ──────────────────────────────────────────────────────────────────────────────
  wave-2:
    needs: wave-1
    if: always() && !cancelled() && (inputs.waves == 'all' || inputs.waves == '' || contains(inputs.waves, '2'))
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - name: promotions
            path: >-
              tests/admin_portal/gift_cards
              tests/admin_portal/coupon_packages
              tests/admin_portal/discounts

          - name: auth-users
            path: >-
              tests/admin_portal/login
              tests/admin_portal/users
              tests/admin_portal/overview
            timeout: 90

          - name: auth-roles
            path: tests/admin_portal/user_roles
            timeout: 180

          - name: financial
            path: >-
              tests/admin_portal/transactions
              tests/admin_portal/cash_report
              tests/admin_portal/general_sales_report

    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '1' }}
      timeout_minutes: ${{ matrix.shard.timeout || 180 }}

# ──────────────────────────────────────────────────────────────────────────────
# WAVE 3  (190 + 212 + 206 = 608 tests)
# ──────────────────────────────────────────────────────────────────────────────
  wave-3:
    needs: wave-2
    if: always() && !cancelled() && (inputs.waves == 'all' || inputs.waves == '' || contains(inputs.waves, '3'))
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - name: memberships-services
            path: >-
              tests/admin_portal/memberships
              tests/admin_portal/custom_services
              tests/admin_portal/service_categories
              tests/admin_portal/bank_drop
            timeout: 180

          - name: sites-settings
            path: >-
              tests/admin_portal/sites
              tests/admin_portal/kiosk_settings
              tests/admin_portal/tunnel_settings

          - name: pos-hardware
            path: >-
              tests/admin_portal/pos_settings
              tests/admin_portal/card_declines
              tests/admin_portal/gas_pump_settings

    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '1' }}
      timeout_minutes: ${{ matrix.shard.timeout || 180 }}

# ──────────────────────────────────────────────────────────────────────────────
# WAVE 4  (267 tests)
# ──────────────────────────────────────────────────────────────────────────────
  wave-4:
    needs: wave-3
    if: always() && !cancelled() && (inputs.waves == 'all' || inputs.waves == '' || contains(inputs.waves, '4'))
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - name: activity
            path: >-
              tests/admin_portal/wash_activity
              tests/admin_portal/redemptions

    uses: ./.github/workflows/run-suite.yml
    secrets:
      dotenv: ${{ secrets.STAGING }}
    with:
      label: admin-${{ matrix.shard.name }}
      environment: staging
      test_path: ${{ matrix.shard.path }}
      parallel: ${{ matrix.shard.parallel || '1' }}
      timeout_minutes: ${{ matrix.shard.timeout || 180 }}
