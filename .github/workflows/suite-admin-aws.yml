name: Admin Suite — AWS runner

# Same as suite-admin.yml (Full / Targeted modes), but on the AWS EC2
# self-hosted runner instead of GitHub-hosted ubuntu-latest. Use this for
# faster runs (larger instance) or when testing against a VPC-internal
# staging environment that GitHub runners can't reach.
#
# Pre-requisites on the runner:
#   - Python 3.11, Google Chrome, ChromeDriver, Java 17 installed
#   - GitHub Actions runner registered with label: self-hosted
#   - STAGING secret (full .env file contents) set in repo/environment secrets
#
# Shares the SAME admin-staging concurrency group as suite-admin.yml — both
# touch the same staging managed records, so a GitHub-hosted run and an AWS
# run must never run at the same time (queue, don't cancel).
#
# Isolated-runner pilot (targeted mode only) — DISABLED as of 2026-10-02.
# admin-isolated-01 (self-hosted-isolated) was never on separate hardware —
# verified 2026-10-03 it ran on the exact same box (ip-172-31-0-106, t3.large:
# 2 vCPU / 8GB) as admin-staging-01/02/03, so it was always a 4th contender
# for the same 2 vCPUs, not an escape from them. Along with the agent-count
# fix below (4 agents -> 1, admin-staging-01 only), admin-isolated-01 has been
# deregistered entirely. `isolated_runner_modules` defaults to empty so
# targeted dispatches don't route any module to a label with zero registered
# runners (that hangs the job in "queued" indefinitely — confirmed firsthand
# right after deregistering, dispatching the default 'login' pilot target).
# Only set isolated_runner_modules/isolated_runner_label if a genuinely
# separate instance is registered under a new label in the future.

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Optional: space-separated test paths / node ids. Each entry runs as its own parallel job (blank = full suite, one job per module).'
        required: false
        default: ''
      parallel:
        description: 'xdist workers per job (this host is t3.large: 2 real vCPUs, same as GitHub-hosted — do not raise above 2, more agents already share these same 2 vCPUs)'
        required: false
        default: '2'
      isolated_runner_modules:
        description: 'Pilot (currently disabled — no isolated runner registered): space-separated module names to route to isolated_runner_label instead of the shared self-hosted pool. Leave blank unless a genuinely separate instance is registered under that label.'
        required: false
        default: ''
      isolated_runner_label:
        description: 'Pilot: runner label for the isolated-runner pilot'
        required: false
        default: 'self-hosted-isolated'

concurrency:
  group: admin-staging
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────────
# FULL SUITE — one job per module, all in parallel (capped).
# max-parallel was 12, implying throughput this host never had even before the
# isolated-runner finding: 4 registered agents share one t3.large (2 vCPU).
# Capped to 2 so GitHub never schedules more concurrent jobs onto this pool
# than its real CPU can run without the confirmed starvation failure. For a
# full 29-module sweep this is multiple hours slower than suite-admin.yml
# (GitHub-hosted, ~44 min) — prefer that workflow for full sweeps and reserve
# this one for targeted 1-2 module runs needing VPC-internal staging access.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  full:
    if: ${{ !inputs.test_path }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module:
          - bank_drop
          - card_declines
          - cash_report
          - coupon_packages
          - custom_services
          - customers
          - discounts
          - employees
          - gas_pump_settings
          - general_sales_report
          - gift_cards
          - kiosk_settings
          - labor_shifts
          - login
          - memberships
          - overview
          - performance_metrics
          - pos_settings
          - redemptions
          - revenue_overview
          - service_categories
          - sites
          - transactions
          - tunnel_settings
          - user_roles
          - users
          - wash_activity
          - wash_books
          - wash_extras
          - wash_packages
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-aws-${{ matrix.module }}
      environment: staging
      test_path: tests/admin_portal/${{ matrix.module }}
      parallel: ${{ inputs.parallel || '2' }}
      # 180, not 90: this host is the same 2-vCPU size as GitHub-hosted but
      # shared with other runner agents and jobs, so a module that fits in
      # 90min there can genuinely need more wall-clock time here. Confirmed
      # in CI: memberships reached only 56% progress (all passing/xfailing,
      # zero real failures) before hitting 90min and getting cancelled —
      # not a stuck test, just slower hardware needing more patience.
      timeout_minutes: 180
      runner: self-hosted

# ──────────────────────────────────────────────────────────────────────────────
# TARGETED  — fast iteration: every entry of test_path is its own parallel job.
#   gh workflow run suite-admin-aws.yml --ref <branch> \
#     -f test_path="tests/admin_portal/cash_report tests/admin_portal/card_declines"
# ──────────────────────────────────────────────────────────────────────────────
  plan:
    if: ${{ inputs.test_path }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.split.outputs.targets }}
    steps:
      - id: split
        env:
          TEST_PATH: ${{ inputs.test_path }}
          ISOLATED_MODULES: ${{ inputs.isolated_runner_modules }}
          ISOLATED_LABEL: ${{ inputs.isolated_runner_label }}
        run: |
          # One matrix entry per path; label = artifact-safe version of the path.
          # runner = isolated_runner_label when the path's module is in the
          # isolated-runner pilot list, else the shared self-hosted pool.
          targets=$(printf '%s\n' $TEST_PATH | python3 -c '
          import json, os, re, sys
          paths = [p for p in sys.stdin.read().split() if p]
          isolated = set(os.environ.get("ISOLATED_MODULES", "").split())
          isolated_label = os.environ.get("ISOLATED_LABEL") or "self-hosted-isolated"
          def runner_for(p):
              module = p.replace("tests/admin_portal/", "").split("/")[0]
              return isolated_label if module in isolated else "self-hosted"
          print(json.dumps([{"path": p, "label": re.sub(r"[^A-Za-z0-9_.-]+", "-", p.replace("tests/admin_portal/", ""))[:80], "runner": runner_for(p)} for p in paths]))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets"

  targeted:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/run-suite.yml
    secrets: inherit
    with:
      label: admin-aws-t-${{ matrix.target.label }}
      environment: staging
      test_path: ${{ matrix.target.path }}
      parallel: ${{ inputs.parallel || '2' }}
      timeout_minutes: 180  # see "full" job above for why
      runner: ${{ matrix.target.runner }}
